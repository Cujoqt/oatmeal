[package]
name = "oatmeal-app"
version = "0.1.1"
description = "Oatmeal — local meeting recorder, invisible to screen sharing"
authors = ["Oatmeal"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "oatmeal_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
screencapturekit = "8.0.1"
whisper-rs = { version = "0.16.0", default-features = false, features = ["metal"] }
llama-cpp-2 = { version = "0.1.152", default-features = false, features = ["metal"] }
encoding_rs = "0.8.35"
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKCalendarItem", "EKCalendar", "EKParticipant", "block2"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSString", "NSArray", "NSEnumerator", "NSURL", "NSCalendar", "NSTimeZone", "NSDateFormatter"] }
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
