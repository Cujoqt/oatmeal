<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oatmeal</title>
  <style>
    /* Warm editorial palette, sidebar shell. The display face is a system serif:
       the app ships offline and the CSP forbids remote font loading. */
    :root {
      color-scheme: light;
      --bg: #f6f2e8; --panel: #efeade; --card: #fffdf8; --ink: #29261d; --ink-soft: #56513f;
      --muted: #8a8474; --faint: #a89f88;
      --line: rgba(41, 38, 29, .09); --line-2: rgba(41, 38, 29, .16);
      --accent: #c8613b; --accent-deep: #a44a2c; --accent-wash: #f3e2d8;
      --good-bg: #e6f0e6; --good-ink: #3f7a4a;
      --key-bg: #e7e0cf; --hover: rgba(41, 38, 29, .05);
      --danger: #c0392b;
      --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --bar-h: 46px; --side-w: 236px;
    }
    /* Dark values are written twice — a media query can't share a rule with a
       plain selector. Edit both blocks together. */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1913; --panel: #17140f; --card: #24201a; --ink: #f0ead9; --ink-soft: #cdc4ad;
      --muted: #948c78; --faint: #7d7565;
      --line: rgba(240, 234, 217, .10); --line-2: rgba(240, 234, 217, .18);
      --accent: #e07a4d; --accent-deep: #f0916a; --accent-wash: #3a2a20;
      --good-bg: #26331f; --good-ink: #9ec98a;
      --key-bg: #322b21; --hover: rgba(240, 234, 217, .06);
      --danger: #ef8a7d;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #1c1913; --panel: #17140f; --card: #24201a; --ink: #f0ead9; --ink-soft: #cdc4ad;
        --muted: #948c78; --faint: #7d7565;
        --line: rgba(240, 234, 217, .10); --line-2: rgba(240, 234, 217, .18);
        --accent: #e07a4d; --accent-deep: #f0916a; --accent-wash: #3a2a20;
        --good-bg: #26331f; --good-ink: #9ec98a;
        --key-bg: #322b21; --hover: rgba(240, 234, 217, .06);
        --danger: #ef8a7d;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--sans); -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; overflow: hidden;
    }
    button { font: inherit; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    ::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }

    /* ── title bar ─────────────────────────────────────────────────────────*/
    .topbar {
      height: var(--bar-h); flex: none; display: flex; align-items: center;
      padding: 0 14px 0 84px; position: relative; user-select: none;
      background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex; align-items: center; gap: 8px; pointer-events: none;
      font-size: 12.5px; font-weight: 500; color: var(--faint);
    }
    .brand .mark { display: flex; align-items: center; gap: 1.5px; height: 12px; }
    .brand .mark i { width: 2px; border-radius: 2px; background: var(--ink-soft); }
    .brand .mark i:nth-child(4), .brand .mark i:nth-child(5) { background: var(--accent); }
    .bar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    #theme {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      background: transparent; border: 1px solid var(--line-2); color: var(--muted);
    }
    #theme:hover { color: var(--ink); border-color: var(--ink-soft); }
    #hide {
      display: inline-flex; align-items: center; gap: 6px;
      font: 500 11px var(--sans); color: var(--muted);
      background: transparent; border: 1px solid var(--line-2); border-radius: 20px;
      padding: 4px 10px; cursor: pointer;
    }
    #hide .eye { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    #hide.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    #hide.on .eye { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }

    /* ── shell ─────────────────────────────────────────────────────────────*/
    .shell { flex: 1; min-height: 0; display: flex; }

    .sidebar {
      width: var(--side-w); flex: none; background: var(--panel);
      border-right: 1px solid var(--line); display: flex; flex-direction: column;
      padding: 12px 10px; gap: 10px;
    }
    .search {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px;
      border: 1px solid var(--line-2); border-radius: 9px; color: var(--muted);
    }
    .search:focus-within { border-color: var(--accent); }
    .search input {
      flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
      font: 400 13px var(--sans); color: var(--ink);
    }
    .search input::placeholder { color: var(--faint); }

    .nav {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px;
      font: 500 13.5px var(--sans); color: var(--ink-soft); cursor: pointer;
      background: none; border: 0; width: 100%; text-align: left;
    }
    .nav:hover { background: var(--hover); }
    .nav.on { background: var(--key-bg); color: var(--ink); }
    .nav svg { width: 16px; height: 16px; flex: none; }

    .side-label {
      font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .8px;
      color: var(--faint); padding: 8px 10px 2px; display: flex; justify-content: space-between;
    }
    .side-list { flex: 1; min-height: 0; overflow-y: auto; }
    .side-item {
      width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
      padding: 7px 10px; border-radius: 9px; display: flex; gap: 9px; align-items: center;
    }
    .side-item:hover { background: var(--hover); }
    .side-item.on { background: var(--key-bg); }
    .side-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); flex: none; }
    .side-item.done .dot { background: var(--accent); }
    .side-item .txt { min-width: 0; }
    .side-item .t { font: 500 13px var(--sans); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-item .s { font: 400 11px var(--sans); color: var(--muted); }
    .side-empty { font: 400 12px var(--sans); color: var(--faint); font-style: italic; padding: 8px 10px; }

    .side-foot { border-top: 1px solid var(--line); padding-top: 8px; }
    .model-chip {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px;
      border-radius: 9px; background: none; border: 0; cursor: pointer; text-align: left;
    }
    .model-chip:hover { background: var(--hover); }
    .model-chip .led { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; }
    .model-chip.ready .led { background: var(--good-ink); }
    .model-chip.busy .led { background: var(--accent); animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .model-chip .txt { font: 400 11.5px var(--sans); color: var(--muted); line-height: 1.3; }

    /* ── content ───────────────────────────────────────────────────────────*/
    .content { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .view { flex: 1; min-height: 0; display: none; flex-direction: column; overflow-y: auto; }
    .view.on { display: flex; animation: rise .3s ease both; }

    /* Home — the editorial record screen. */
    #viewHome { align-items: center; justify-content: center; text-align: center; padding: 24px 40px 28px; gap: 18px; }
    .eyebrow { font: 500 12px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: 1.5px; }
    h1 {
      font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1.12;
      margin: 0; letter-spacing: -.5px; max-width: 540px; text-wrap: balance;
    }
    #title {
      font-family: var(--display); font-size: 17px; color: var(--ink); background: transparent;
      border: 0; border-bottom: 1px solid var(--line-2); padding: 5px 4px; text-align: center;
      width: 320px; outline: none;
    }
    #title::placeholder { color: var(--faint); font-style: italic; }
    #title:focus { border-bottom-color: var(--accent); }

    .orb { position: relative; width: 112px; height: 112px; display: flex; align-items: center; justify-content: center; }
    @keyframes oatpulse { 0% { transform: scale(1); opacity: .45 } 70% { opacity: 0 } 100% { transform: scale(2.1); opacity: 0 } }
    .orb .pulse { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); opacity: 0; }
    body.recording .orb .pulse { animation: oatpulse 2.4s ease-out infinite; }
    #btn {
      position: relative; width: 92px; height: 92px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer; color: #fff;
      box-shadow: 0 10px 24px -6px rgba(160, 72, 40, .55);
      display: flex; align-items: center; justify-content: center;
    }
    #btn:hover:not(:disabled) { background: var(--accent-deep); }
    #btn:disabled { opacity: .5; cursor: default; box-shadow: none; }

    @keyframes oatwave { 0%, 100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }
    .wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 26px; }
    .wave b {
      display: inline-block; width: 3px; border-radius: 3px; background: var(--accent);
      transform-origin: center; transform: scaleY(.25); opacity: .4;
    }
    body.recording .wave b { opacity: 1; animation: oatwave 1.1s ease-in-out infinite; }
    .hint { font-size: 13.5px; color: var(--muted); min-height: 1.3em; }
    .hint kbd { background: var(--key-bg); border-radius: 5px; padding: 2px 8px; font: 600 12px var(--mono); }
    #timer {
      display: none; font: 600 30px var(--mono); font-variant-numeric: tabular-nums;
      color: var(--accent); letter-spacing: 1px;
    }
    body.recording #timer { display: block; }
    body.recording .hint { display: none; }
    #status { font-size: 13px; color: var(--muted); min-height: 1.3em; }
    #status.err { color: var(--danger); }

    .stats { display: flex; gap: 26px; padding-top: 6px; }
    .stats .num { font-family: var(--display); font-size: 26px; line-height: 1; }
    .stats .num.accent { color: var(--accent); }
    .stats .cap { font: 400 11.5px var(--sans); color: var(--muted); margin-top: 3px; }

    /* Note view — the primary surface once a meeting exists. */
    #viewNote { padding: 0; }
    .note-wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 26px 32px 20px; flex: 1; }
    .note-title {
      font-family: var(--display); font-weight: 400; font-size: 34px; letter-spacing: -.4px;
      color: var(--ink); background: transparent; border: 0; outline: none; width: 100%;
      padding: 0 0 8px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 20px;
      border: 1px solid var(--line-2); background: transparent; color: var(--ink-soft);
      font: 500 12.5px var(--sans); cursor: default;
    }
    .chip.act { cursor: pointer; }
    .chip.act:hover { background: var(--hover); }
    .chip.sel { background: var(--key-bg); border-color: transparent; color: var(--ink); }
    .chip svg { width: 14px; height: 14px; }
    .chip.danger:hover { color: var(--danger); border-color: var(--danger); }

    .seg-toggle { display: inline-flex; border: 1px solid var(--line-2); border-radius: 20px; overflow: hidden; }
    .seg-toggle button {
      border: 0; background: transparent; color: var(--muted); cursor: pointer;
      font: 500 12.5px var(--sans); padding: 6px 14px; display: inline-flex; align-items: center; gap: 6px;
    }
    .seg-toggle button.on { background: var(--key-bg); color: var(--ink); }

    .prose { font-size: 15px; line-height: 1.7; color: var(--ink-soft); }
    .prose h2 {
      font-family: var(--display); font-weight: 500; font-size: 19px; color: var(--ink);
      margin: 26px 0 8px; letter-spacing: -.2px;
    }
    .prose h3 { font: 600 14px var(--sans); color: var(--ink); margin: 20px 0 6px; }
    .prose p { margin: 0 0 12px; }
    .prose ul { margin: 0 0 12px; padding-left: 20px; }
    .prose li { margin-bottom: 5px; }
    .prose strong { color: var(--ink); font-weight: 600; }
    .prose .placeholder { color: var(--faint); font-style: italic; }

    .seg-line { display: flex; gap: 12px; margin-bottom: 10px; font-size: 14.5px; line-height: 1.65; }
    .seg-line b { font: 600 11px var(--mono); color: var(--accent); flex: none; padding-top: 3px; }

    .gen {
      display: inline-flex; align-items: center; gap: 9px; padding: 10px 18px; border-radius: 11px;
      background: var(--accent); color: #fff; border: 0; cursor: pointer; font: 600 13.5px var(--sans);
    }
    .gen:hover:not(:disabled) { background: var(--accent-deep); }
    .gen:disabled { opacity: .55; cursor: default; }
    .note-empty { text-align: center; padding: 40px 0; }
    .note-empty p { color: var(--muted); font-size: 14px; max-width: 400px; margin: 0 auto 18px; line-height: 1.6; }

    /* Ask bar — pinned to the bottom of the note view. */
    .askbar { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 62%, transparent); padding: 14px 32px 18px; }
    .askbar-inner { max-width: 720px; margin: 0 auto; }
    .suggest { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 9px; }
    .suggest button {
      border: 1px solid var(--line-2); background: var(--card); color: var(--ink-soft);
      border-radius: 18px; padding: 6px 12px; font: 500 12.5px var(--sans); cursor: pointer;
    }
    .suggest button:hover { border-color: var(--accent); color: var(--accent); }
    .ask {
      display: flex; align-items: center; gap: 10px; background: var(--card);
      border: 1px solid var(--line-2); border-radius: 22px; padding: 6px 6px 6px 16px;
    }
    .ask:focus-within { border-color: var(--accent); }
    .ask input {
      flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
      font: 400 14px var(--sans); color: var(--ink); padding: 6px 0;
    }
    .ask input::placeholder { color: var(--faint); }
    .ask button {
      width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
      background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center;
    }
    .ask button:disabled { opacity: .45; cursor: default; }

    .answers { max-width: 720px; margin: 0 auto; padding: 0 32px; }
    .qa { margin-bottom: 18px; animation: rise .3s ease both; }
    .qa .q { font: 600 14px var(--sans); color: var(--ink); margin-bottom: 6px; display: flex; gap: 8px; }
    .qa .q::before { content: "›"; color: var(--accent); }
    .qa .a { font-size: 14.5px; line-height: 1.7; color: var(--ink-soft); }
    .qa .a.thinking { color: var(--faint); font-style: italic; }

    /* ── live dock ─────────────────────────────────────────────────────────
       A floating panel over whatever view is open, showing text as it lands. */
    .livedock {
      position: fixed; right: 20px; bottom: 20px; width: 380px; max-height: 52vh;
      background: var(--card); border: 1px solid var(--line-2); border-radius: 16px;
      box-shadow: 0 18px 44px -14px rgba(0, 0, 0, .35); display: none; flex-direction: column;
      overflow: hidden; z-index: 20;
    }
    body.recording .livedock { display: flex; animation: rise .3s ease both; }
    body.recording .livedock.min { max-height: none; }
    .livedock-hd {
      display: flex; align-items: center; gap: 9px; padding: 10px 12px;
      border-bottom: 1px solid var(--line); font: 600 11.5px var(--sans);
      text-transform: uppercase; letter-spacing: .7px; color: var(--muted);
    }
    .livedock.min .livedock-hd { border-bottom: 0; }
    .livedock-hd .rec { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); animation: blink 1.4s ease-in-out infinite; }
    .livedock-hd .grow { flex: 1; }
    .livedock-hd button {
      background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 5px; border-radius: 6px;
    }
    .livedock-hd button:hover { background: var(--hover); color: var(--ink); }
    .livedock-body { overflow-y: auto; padding: 12px; font-size: 13.5px; line-height: 1.65; color: var(--ink-soft); }
    .livedock.min .livedock-body, .livedock.min .livedock-foot { display: none; }
    .livedock-body .l { margin-bottom: 8px; animation: rise .25s ease both; }
    .livedock-body .waiting { color: var(--faint); font-style: italic; }
    .livedock-foot { border-top: 1px solid var(--line); padding: 8px; }
    .livedock-foot .ask { border-radius: 18px; padding: 4px 4px 4px 12px; }
    .livedock-foot .ask input { font-size: 13px; }
    .livedock-foot .ask button { width: 28px; height: 28px; }
    #liveAnswer { padding: 8px 12px 0; font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
    #liveAnswer:empty { display: none; }

    @media (max-width: 820px) {
      .sidebar { width: 64px; padding: 12px 8px; }
      .sidebar .search input, .side-label, .side-item .txt, .nav span, .model-chip .txt { display: none; }
      .livedock { width: 300px; }
    }
  </style>
</head>
<body>
  <div class="topbar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <span class="mark" aria-hidden="true">
        <i style="height:26%"></i><i style="height:44%"></i><i style="height:56%"></i><i style="height:62%"></i><i style="height:32%"></i>
      </span>Oatmeal
    </div>
    <div class="bar-actions">
      <button id="theme" title="Switch theme" aria-label="Switch theme">
        <svg id="themeIcon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
      <button id="hide" class="on" title="Toggle invisibility to screen sharing">
        <span class="eye"></span><span id="hideLabel">hidden from shares</span>
      </button>
    </div>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4-4" /></svg>
        <input id="search" placeholder="Search meetings" />
      </div>

      <button class="nav on" id="navHome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8" /><path d="M5 10v10h14V10" /></svg>
        <span>New recording</span>
      </button>

      <div class="side-label"><span>Meetings</span><span id="sideCount"></span></div>
      <div class="side-list" id="sideList"></div>

      <div class="side-foot">
        <button class="model-chip" id="modelChip" title="Local models">
          <span class="led"></span>
          <span class="txt" id="modelTxt">Checking models…</span>
        </button>
      </div>
    </aside>

    <div class="content">
      <!-- Home: record -->
      <section class="view on" id="viewHome">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="headline">What are we talking about today?</h1>
        <input id="title" placeholder="Name this meeting (optional)" />

        <div class="orb">
          <span class="pulse"></span>
          <button id="btn" title="Record">
            <svg id="btnIcon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="9" y="3" width="6" height="11" rx="3" /><path d="M6 11a6 6 0 0 0 12 0M12 17v3" />
            </svg>
          </button>
        </div>

        <div class="wave">
          <b style="height:35%;animation-delay:0s"></b><b style="height:70%;animation-delay:.1s"></b>
          <b style="height:45%;animation-delay:.2s"></b><b style="height:100%;animation-delay:.3s"></b>
          <b style="height:60%;animation-delay:.15s"></b><b style="height:85%;animation-delay:.25s"></b>
          <b style="height:40%;animation-delay:.05s"></b><b style="height:75%;animation-delay:.35s"></b>
          <b style="height:95%;animation-delay:.2s"></b><b style="height:50%;animation-delay:.1s"></b>
          <b style="height:65%;animation-delay:.3s"></b><b style="height:30%;animation-delay:.4s"></b>
        </div>

        <div id="timer">00:00</div>
        <div class="hint">Tap to record &nbsp;·&nbsp; or press <kbd>Space</kbd></div>
        <div id="status"></div>

        <div class="stats">
          <div>
            <div class="num" id="statCount">—</div>
            <div class="cap">meetings this week</div>
          </div>
          <div>
            <div class="num accent" id="statHours">—</div>
            <div class="cap">of notes written for you</div>
          </div>
        </div>
      </section>

      <!-- Note: the primary surface for a recorded meeting -->
      <section class="view" id="viewNote">
        <div class="note-wrap">
          <input class="note-title" id="noteTitle" />
          <div class="chips">
            <div class="seg-toggle">
              <button id="tabNotes" class="on">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z" /></svg>
                Enhanced
              </button>
              <button id="tabRaw">Transcript</button>
            </div>
            <span class="chip" id="chipWhen"></span>
            <button class="chip act danger" id="chipDelete" title="Move to Trash">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7M6.5 7l.8 12a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5l.8-12" /></svg>
              Delete
            </button>
          </div>

          <div class="prose" id="noteBody"></div>
          <div class="answers" id="answers"></div>
        </div>

        <div class="askbar">
          <div class="askbar-inner">
            <div class="suggest" id="suggest"></div>
            <div class="ask">
              <input id="askInput" placeholder="Ask anything about this meeting" />
              <button id="askSend" title="Ask" aria-label="Ask">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Live transcript, floating over whatever view is open -->
  <div class="livedock" id="livedock">
    <div class="livedock-hd">
      <span class="rec"></span><span>Live transcript</span><span class="grow"></span>
      <button id="dockMin" title="Collapse" aria-label="Collapse">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14" /></svg>
      </button>
    </div>
    <div class="livedock-body" id="liveBody">
      <div class="waiting">Listening… text appears a few seconds behind the room.</div>
    </div>
    <div id="liveAnswer"></div>
    <div class="livedock-foot">
      <div class="ask">
        <input id="liveAsk" placeholder="What did I miss?" />
        <button id="liveSend" title="Ask" aria-label="Ask">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
