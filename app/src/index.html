<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oatmeal</title>
  <link rel="stylesheet" href="/base.css" />
  <style>
    body {
      background: var(--bg);
      min-height: 100vh;
      /* Room for the overlay traffic lights up top, and the dock down bottom. */
      padding: 3.2rem 0 6rem;
    }

    .drag { position: fixed; top: 0; left: 0; right: 0; height: 3.2rem; z-index: 5; }

    .sheet { max-width: 720px; margin: 0 auto; padding: 0 2.4rem; animation: rise .4s cubic-bezier(.2,.7,.3,1) both; }

    /* ── title ─────────────────────────────────────────────────────────── */
    #title {
      font-family: var(--serif);
      font-size: 2.3rem;
      line-height: 1.15;
      font-weight: 400;
      color: var(--ink);
      outline: none;
      margin: 0 0 .85rem;
      caret-color: var(--green);
    }
    #title:empty::before {
      content: attr(data-placeholder);
      color: var(--ink-faint);
      pointer-events: none;
    }

    /* ── metadata chips ────────────────────────────────────────────────── */
    .meta { display: flex; align-items: center; gap: .6rem; margin-bottom: 2.2rem; }
    .chips {
      display: inline-flex; align-items: center; gap: .55rem;
      border: 1px solid var(--line); border-radius: 999px;
      padding: .34rem .8rem; font-size: .82rem; color: var(--ink-soft);
    }
    .chips .chip { display: inline-flex; align-items: center; gap: .35rem; }
    .chips .chip + .chip { margin-left: .35rem; }
    .chips svg { width: 15px; height: 15px; color: var(--ink-muted); }
    .meta .icon-btn { border: 1px solid var(--line); border-radius: 999px; width: 34px; height: 30px; }

    /* ── note body ─────────────────────────────────────────────────────── */
    #notes {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--ink-soft);
      outline: none;
      min-height: 8rem;
      white-space: pre-wrap;
      caret-color: var(--green);
    }
    #notes:empty::before {
      content: attr(data-placeholder);
      color: var(--ink-faint);
      pointer-events: none;
    }
    #saveHint {
      margin-top: .9rem; font-size: .72rem; color: var(--ink-faint);
      opacity: 0; transition: opacity .25s;
    }
    #saveHint.show { opacity: 1; }

    /* ── onboarding card ───────────────────────────────────────────────── */
    #intro {
      max-width: 620px; margin: 3.5rem auto 0;
      background: var(--surface); border-radius: var(--r-lg);
      padding: 2.6rem 2.8rem 2.2rem;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .38);
      animation: rise .45s cubic-bezier(.2,.7,.3,1) both .1s;
    }
    #intro[hidden] { display: none; }
    .plus {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid var(--orange); color: var(--orange);
      display: grid; place-items: center; margin-bottom: 1.6rem;
    }
    .plus svg { width: 20px; height: 20px; }
    #intro h2 { font-family: var(--serif); font-weight: 400; font-size: 1.9rem; margin: 0 0 1.4rem; }
    #intro p { margin: 0 0 .95rem; font-size: .95rem; line-height: 1.5; color: var(--ink); }
    #intro .hl { color: var(--green); display: inline-flex; align-items: center; gap: .3rem; }
    #intro .hl svg { width: 15px; height: 15px; }
    #okay {
      margin-top: 1.5rem; font: inherit; font-size: .9rem;
      background: #fff; color: #1a1a1a; border: 0; border-radius: 999px;
      padding: .6rem 1.5rem; cursor: pointer; transition: opacity .14s, transform .08s;
    }
    #okay:hover { opacity: .88; }
    #okay:active { transform: translateY(1px); }

    /* ── bottom dock ───────────────────────────────────────────────────── */
    .dock {
      position: fixed; left: 0; right: 0; bottom: 1.4rem; z-index: 6;
      display: flex; align-items: center; gap: .8rem;
      padding: 0 1.6rem;
    }
    .dock .ask {
      flex: 1; min-width: 0;
      background: var(--surface-2); border: 1px solid transparent; border-radius: 999px;
      padding: .8rem 1.4rem; font: inherit; font-size: .92rem; color: var(--ink);
      outline: none;
    }
    .dock .ask::placeholder { color: var(--ink-faint); }
    .dock .ask:focus { border-color: var(--line); }

    #status {
      position: fixed; left: 0; right: 0; bottom: 4.4rem; z-index: 6;
      text-align: center; font-size: .78rem; color: var(--ink-muted);
      pointer-events: none; min-height: 1.1em;
    }
    #status.err { color: var(--red); }

    /* ── screen-share shield ───────────────────────────────────────────── */
    #hide {
      position: fixed; top: .9rem; right: 1rem; z-index: 7;
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .68rem; color: var(--ink-faint);
      border: 1px solid var(--line-soft); border-radius: 999px;
      padding: .28rem .7rem; cursor: pointer; user-select: none;
      background: var(--bg); transition: color .14s, border-color .14s;
    }
    #hide .eye { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); }
    #hide.on { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
    #hide.on .eye { background: var(--green); }

    @media (max-width: 620px) {
      .sheet { padding: 0 1.4rem; }
      #title { font-size: 1.9rem; }
      #intro { padding: 2rem 1.6rem 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="drag" data-tauri-drag-region></div>

  <div id="hide" class="on" title="Toggle invisibility to screen sharing">
    <span class="eye"></span><span id="hideLabel">hidden from shares</span>
  </div>

  <div class="sheet">
    <h1 id="title" contenteditable="plaintext-only" data-placeholder="New note" spellcheck="false"></h1>

    <div class="meta">
      <div class="chips">
        <span class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <rect x="3" y="4.5" width="18" height="16" rx="3" /><path d="M3 9h18M8 3v3M16 3v3" />
          </svg>
          <span id="day">Today</span>
        </span>
        <span class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="9" cy="8" r="3.2" /><path d="M2.8 19.5a6.2 6.2 0 0 1 12.4 0" />
            <path d="M16.5 5.6a3.2 3.2 0 0 1 0 5.6M18 14.4a6.2 6.2 0 0 1 3.2 5.1" />
          </svg>
          <span>Me</span>
        </span>
      </div>
      <button class="icon-btn" id="reveal" title="Show the recording folder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M3 7.5A2 2 0 0 1 5 5.5h3.6l1.8 2.2H19a2 2 0 0 1 2 2v8.3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <path d="M12 11.6v5M9.5 14.1h5" />
        </svg>
      </button>
    </div>

    <div id="notes" contenteditable="plaintext-only" data-placeholder="Write notes"></div>
    <div id="saveHint"></div>

    <section id="intro" hidden>
      <div class="plus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </div>
      <h2>New Note</h2>
      <p>Use new notes for meetings that aren't on your calendar.</p>
      <p>Oatmeal will
        <span class="hl">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M5 10v4M9 6.5v11M13 8.5v7M17 11v2" />
          </svg>transcribe</span>, but won't know who is speaking.
      </p>
      <p>Oatmeal will
        <span class="hl">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.5l1.7 4.3 4.3 1.7-4.3 1.7L12 15.5l-1.7-4.3L6 9.5l4.3-1.7z" />
            <path d="M18.5 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" />
          </svg>write notes for you</span> once the transcript has stopped.
      </p>
      <p style="color: var(--ink-muted); font-size: .86rem;">Everything stays on this machine — no audio is uploaded.</p>
      <button id="okay">Okay</button>
    </section>
  </div>

  <div id="status">Ready.</div>

  <div class="dock">
    <div class="cluster" id="cluster">
      <span class="dots"><i></i><i></i><i></i></span>
      <button class="icon-btn" id="expand" title="Show the transcript window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 14l6-6 6 6" />
        </svg>
      </button>
      <button class="square" id="rec" title="Start recording"></button>
    </div>
    <input class="ask" id="ask" placeholder="Ask anything" />
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
