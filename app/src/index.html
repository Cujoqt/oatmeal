<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oatmeal</title>
  <style>
    /* Design: "Editorial center-stage record + bento stats & waveform" (2a).
       The display face is a system serif rather than Fraunces — the app ships
       offline and the CSP forbids remote font loading. */
    :root {
      color-scheme: light;
      --bg: #f6f2e8; --card: #fffdf8; --ink: #29261d; --ink-soft: #56513f;
      --muted: #8a8474; --faint: #a89f88;
      --line: rgba(41, 38, 29, .09); --line-2: rgba(41, 38, 29, .16);
      --accent: #c8613b; --accent-deep: #a44a2c; --accent-wash: #f3e2d8;
      --good-bg: #e6f0e6; --good-ink: #3f7a4a;
      --key-bg: #e7e0cf;
      --display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      --bar-h: 46px;
    }
    /* Dark palette. Applied when the user picks dark explicitly, or when they
       haven't picked at all and the OS is dark. `data-theme` on <html> is the
       override; the media query only speaks for the unset case. The values are
       written twice because a media query can't share a rule with a plain
       selector — edit both blocks together. */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1913; --card: #24201a; --ink: #f0ead9; --ink-soft: #cdc4ad;
      --muted: #948c78; --faint: #7d7565;
      --line: rgba(240, 234, 217, .10); --line-2: rgba(240, 234, 217, .18);
      --accent: #e07a4d; --accent-deep: #f0916a; --accent-wash: #3a2a20;
      --good-bg: #26331f; --good-ink: #9ec98a;
      --key-bg: #322b21;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #1c1913; --card: #24201a; --ink: #f0ead9; --ink-soft: #cdc4ad;
        --muted: #948c78; --faint: #7d7565;
        --line: rgba(240, 234, 217, .10); --line-2: rgba(240, 234, 217, .18);
        --accent: #e07a4d; --accent-deep: #f0916a; --accent-wash: #3a2a20;
        --good-bg: #26331f; --good-ink: #9ec98a;
        --key-bg: #322b21;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--sans); -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── title bar ─────────────────────────────────────────────────────────
       The native title bar is an overlay, so this strip sits underneath the
       traffic lights. `data-tauri-drag-region` makes it drag the window. */
    .topbar {
      height: var(--bar-h); flex: none; display: flex; align-items: center;
      padding: 0 16px 0 84px; position: relative; user-select: none;
    }
    .brand {
      position: absolute; left: 0; right: 0; pointer-events: none;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      font-size: 12.5px; font-weight: 500; letter-spacing: .2px; color: var(--faint);
    }
    .brand .mark { display: flex; align-items: center; gap: 1.5px; height: 12px; }
    .brand .mark i { width: 2px; border-radius: 2px; background: var(--ink-soft); }
    .brand .mark i:nth-child(4), .brand .mark i:nth-child(5) { background: var(--accent); }

    .bar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    #theme {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      background: transparent; border: 1px solid var(--line-2); color: var(--muted);
      transition: color .15s, border-color .15s;
    }
    #theme:hover { color: var(--ink); border-color: var(--ink-soft); }
    #hide {
      display: inline-flex; align-items: center; gap: 6px;
      font: 500 11px var(--sans); letter-spacing: .2px; color: var(--muted);
      background: transparent; border: 1px solid var(--line-2); border-radius: 20px;
      padding: 4px 10px; cursor: pointer; transition: color .15s, border-color .15s;
    }
    #hide .eye { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    #hide.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    #hide.on .eye { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }

    /* ── layout ────────────────────────────────────────────────────────────*/
    main {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding: 20px 40px 26px; gap: 14px;
    }
    .hero {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 18px;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .hero > *, .bento > * { animation: rise .45s cubic-bezier(.2,.7,.3,1) both; }

    .eyebrow {
      font: 500 12px var(--sans); color: var(--faint);
      text-transform: uppercase; letter-spacing: 1.5px;
    }
    h1 {
      font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1.12;
      margin: 0; letter-spacing: -.5px; max-width: 540px; text-wrap: balance;
    }

    /* Meeting title — a quiet editorial line, not a form field. */
    #title {
      font-family: var(--display); font-size: 17px; color: var(--ink);
      background: transparent; border: 0; border-bottom: 1px solid var(--line-2);
      padding: 5px 4px; text-align: center; width: 320px; outline: none;
      transition: border-color .15s;
    }
    #title::placeholder { color: var(--faint); font-style: italic; }
    #title:focus { border-bottom-color: var(--accent); }
    #title:disabled { border-bottom-color: transparent; color: var(--ink-soft); }

    /* ── record orb ────────────────────────────────────────────────────────*/
    .orb { position: relative; width: 112px; height: 112px; display: flex; align-items: center; justify-content: center; }
    @keyframes oatpulse { 0% { transform: scale(1); opacity: .45 } 70% { opacity: 0 } 100% { transform: scale(2.1); opacity: 0 } }
    .orb .pulse { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); opacity: 0; }
    body.recording .orb .pulse { animation: oatpulse 2.4s ease-out infinite; }
    #btn {
      position: relative; width: 92px; height: 92px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer; color: #fff;
      box-shadow: 0 10px 24px -6px rgba(160, 72, 40, .55);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .08s, box-shadow .15s;
    }
    #btn:hover:not(:disabled) { background: var(--accent-deep); }
    #btn:active:not(:disabled) { transform: translateY(1px); }
    #btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
    #btn svg { pointer-events: none; }

    /* ── waveform ──────────────────────────────────────────────────────────*/
    @keyframes oatwave { 0%, 100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }
    .wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 26px; }
    .wave b {
      display: inline-block; width: 3px; border-radius: 3px; background: var(--accent);
      transform-origin: center; transform: scaleY(.25); opacity: .4;
      transition: opacity .3s;
    }
    body.recording .wave b { opacity: 1; animation: oatwave 1.1s ease-in-out infinite; }

    .hint { font-size: 13.5px; color: var(--muted); margin-top: -4px; min-height: 1.3em; }
    .hint kbd {
      background: var(--key-bg); border-radius: 5px; padding: 2px 8px;
      font: 600 12px var(--mono); color: var(--ink-soft);
    }
    #timer {
      display: none; font: 600 30px var(--mono); font-variant-numeric: tabular-nums;
      color: var(--accent); letter-spacing: 1px;
    }
    body.recording #timer { display: block; }
    body.recording .hint { display: none; }
    #status { font-size: 13px; color: var(--muted); min-height: 1.3em; }
    #status.err { color: #c0392b; }
    @media (prefers-color-scheme: dark) { #status.err { color: #ef8a7d; } }

    /* ── bento row ─────────────────────────────────────────────────────────*/
    .bento { flex: none; display: grid; grid-template-columns: 1fr 1.55fr; gap: 14px; }
    .box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
    .stats { padding: 18px 20px; display: flex; gap: 14px; align-items: center; }
    .stats > div { flex: 1; }
    .stats .rule { flex: none; width: 1px; align-self: stretch; background: var(--line-2); }
    .stats .num { font-family: var(--display); font-size: 28px; line-height: 1; }
    .stats .num.accent { color: var(--accent); }
    .stats .cap { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.35; }

    .recent { padding: 14px 16px 6px; display: flex; flex-direction: column; min-height: 0; }
    .recent-hd { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
    .recent-hd .label {
      font: 600 11.5px var(--sans); text-transform: uppercase; letter-spacing: .7px; color: var(--muted);
    }
    .recent-hd .all { font: 500 12px var(--sans); color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; }
    .recent-hd .all:hover { color: var(--accent-deep); }
    .recent-body { overflow-y: auto; }
    .mrow {
      display: flex; align-items: center; gap: 14px; padding: 8px; border-radius: 11px;
      text-align: left;
    }
    .mrow + .mrow { margin-top: 2px; }
    .mico {
      width: 30px; height: 30px; border-radius: 10px; background: var(--accent-wash);
      display: flex; align-items: center; justify-content: center; flex: none; color: var(--accent);
    }
    .mrow .meta { flex: 1; min-width: 0; }
    .mrow .name { font: 600 13px var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mrow .sub { font: 400 11px var(--sans); color: var(--muted); }
    .tag { font: 600 10px var(--sans); padding: 3px 9px; border-radius: 20px; flex: none; }
    .tag.done { background: var(--good-bg); color: var(--good-ink); }
    .tag.audio { background: var(--key-bg); color: var(--ink-soft); }
    .empty { font-size: 12.5px; color: var(--faint); font-style: italic; padding: 10px 8px 14px; }

    /* ── transcript result ─────────────────────────────────────────────────*/
    #result { display: none; }
    body.showing-result .bento { display: none; }
    body.showing-result #result { display: flex; }
    #result {
      flex: 1; min-height: 0; flex-direction: column;
      padding: 16px 20px 12px; animation: rise .35s ease both;
    }
    .result-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .result-hd .label { font: 600 11.5px var(--sans); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
    #saved { font: 400 11px var(--mono); color: var(--faint); word-break: break-all; margin-bottom: 8px; }
    #transcript { overflow-y: auto; border-top: 1px solid var(--line); padding-top: 10px; }
    .seg { font-size: 13.5px; line-height: 1.65; color: var(--ink-soft); margin-bottom: 8px; }
    .seg b { font: 600 11px var(--mono); color: var(--accent); margin-right: 6px; }
    body.showing-result .hero { flex: none; gap: 12px; }
    body.showing-result .orb { width: 74px; height: 74px; }
    body.showing-result #btn { width: 62px; height: 62px; }
    body.showing-result h1 { font-size: 26px; }
    body.showing-result .wave { display: none; }

    ::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }

    @media (max-width: 720px) { .bento { grid-template-columns: 1fr; } main { padding: 16px 22px 20px; } }
  </style>
</head>
<body>
  <div class="topbar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <span class="mark" aria-hidden="true">
        <i style="height:26%"></i><i style="height:44%"></i><i style="height:56%"></i><i style="height:62%"></i><i style="height:32%"></i>
      </span>Oatmeal — Home
    </div>
    <div class="bar-actions">
      <button id="theme" title="Switch theme" aria-label="Switch theme">
        <svg id="themeIcon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
      <button id="hide" class="on" title="Toggle invisibility to screen sharing">
        <span class="eye"></span><span id="hideLabel">hidden from shares</span>
      </button>
    </div>
  </div>

  <main>
    <section class="hero">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="headline">What are we talking about today?</h1>
      <input id="title" placeholder="Name this meeting (optional)" />

      <div class="orb">
        <span class="pulse"></span>
        <button id="btn" title="Record">
          <svg id="btnIcon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M6 11a6 6 0 0 0 12 0M12 17v3" />
          </svg>
        </button>
      </div>

      <div class="wave">
        <b style="height:35%;animation-delay:0s"></b><b style="height:70%;animation-delay:.1s"></b>
        <b style="height:45%;animation-delay:.2s"></b><b style="height:100%;animation-delay:.3s"></b>
        <b style="height:60%;animation-delay:.15s"></b><b style="height:85%;animation-delay:.25s"></b>
        <b style="height:40%;animation-delay:.05s"></b><b style="height:75%;animation-delay:.35s"></b>
        <b style="height:95%;animation-delay:.2s"></b><b style="height:50%;animation-delay:.1s"></b>
        <b style="height:65%;animation-delay:.3s"></b><b style="height:30%;animation-delay:.4s"></b>
      </div>

      <div id="timer">00:00</div>
      <div class="hint">Tap to record &nbsp;·&nbsp; or press <kbd>Space</kbd></div>
      <div id="status"></div>
    </section>

    <section class="bento">
      <div class="box stats">
        <div>
          <div class="num" id="statCount">—</div>
          <div class="cap">meetings<br />this week</div>
        </div>
        <div class="rule"></div>
        <div>
          <div class="num accent" id="statHours">—</div>
          <div class="cap">of notes<br />written for you</div>
        </div>
      </div>

      <div class="box recent">
        <div class="recent-hd">
          <div class="label">Recent</div>
          <button class="all" id="viewAll">View all</button>
        </div>
        <div class="recent-body" id="recentBody">
          <div class="empty">Loading…</div>
        </div>
      </div>
    </section>

    <section class="box" id="result">
      <div class="result-hd">
        <div class="label">Transcript</div>
      </div>
      <div id="saved"></div>
      <div id="transcript"></div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
